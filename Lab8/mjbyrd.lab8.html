<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors HW10</title>
    <link rel="stylesheet" href="mjbyrd.lab8.css">
</head>
<body>
    <div class="arcade-cabinet">
        <header>
            <h1>RPS Arcade</h1>
            <p class="subtitle">Choose wisely!</p>
        </header>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box">
                <span>Player</span>
                <span id="player-score">0</span>
            </div>
            <div class="score-box">
                <span>Computer</span>
                <span id="computer-score">0</span>
            </div>
        </div>

        <!-- Display arena -->
        <div class="battle-arena">
            <div class="fighter-display">
                <span id="user-emoji" class="emoji-icon">❓</span>
                <p id="user-choice">You</p>
            </div>
            <span class="vs-text">VS</span>
            <div class="fighter-display">
                <span id="computer-emoji" class="emoji-icon">❓</span>
                <p id="computer-choice">Computer</p>
            </div>
        </div>

        <!-- Announces results -->
        <h2 id="winner-announcement">Make your move!</h2>

        <div class="choices-container">
            <button id="rock" class="choice-btn rock-btn">Rock</button>
            <button id="paper" class="choice-btn paper-btn">Paper</button>
            <button id="scissors" class="choice-btn scissors-btn">Scissors</button>
        </div>
    </div>

    
    <script src="mjbyrd.lab8.js" defer></script>
</body>
</html>
