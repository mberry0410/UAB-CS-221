<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 
        HW8 - Photo Gallery
    </title>
    <!-- Links External CSS stylesheet-->
    <link rel="stylesheet" href="hw8.mjbyrd.css">
</head>
<body>
    <!-- Header containing sticky gallery title -->
    <header class="gallery-header">
        <h1>Photo Gallery </h1>
    </header>

    <!--Main container for the CSS grid -->
    <main class="photo-grid">

        <!--Grid picture 1-->
        <div class="grid-item item-1" data-caption="Pic 1"></div>

        <!--Grid picture 2-->
        <div class="grid-item item-2" data-caption="Pic 2"></div>

        <!--Grid picture 3-->
        <div class="grid-item item-3" data-caption="Pic 3"></div>

        <!--Grid picture 4-->
        <div class="grid-item item-4" data-caption="Pic 4"></div>

        <!--Grid picture 5-->
        <div class="grid-item item-5" data-caption="Pic 5"></div>

        <!--Grid picture 6-->
        <div class="grid-item item-6 featured-item" data-caption="Pic 6"></div>

    </main>

</body>
</html>
